<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명일방주: 엔드필드 오픈 타이머</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #ffffff;
            --accent-color: #00ff9d;
            --danger-color: #ff4757;
            --dim-color: #444;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            user-select: none;
        }

        /* 메인 타이머 컨테이너 */
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* 시:분:초 */
        .main-time {
            /* 뷰포트 너비에 따라 글자 크기 유동적 조절 (최소 40px, 최대 18vw) */
            font-size: clamp(3rem, 18vw, 12rem);
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums; /* 숫자 너비 고정으로 떨림 방지 */
            letter-spacing: -0.05em;
            text-align: center;
        }

        /* 밀리초 */
        .milliseconds {
            font-size: clamp(1.5rem, 6vw, 4rem);
            color: var(--accent-color);
            font-weight: 400;
            margin-top: -10px;
            font-variant-numeric: tabular-nums;
            opacity: 0.9;
        }

        .access-label {
            margin-top: 20px;
            font-size: clamp(1rem, 2.4vw, 1.3rem);
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 0.4em;
        }

        /* 목표 시간 표시 */
        .target-label {
            margin-bottom: 20px;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            color: var(--dim-color);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* 하단 정보 바 */
        .status-bar {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            color: #666;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--dim-color);
        }

        .dot.active { background-color: var(--accent-color); box-shadow: 0 0 8px var(--accent-color); }
        .dot.error { background-color: var(--danger-color); }
        .dot.syncing { background-color: #ffd700; animation: blink 1s infinite; }

        @keyframes blink { 50% { opacity: 0.3; } }

        /* 재동기화 버튼 */
        .sync-btn {
            background: transparent;
            border: 1px solid #333;
            color: #666;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        .sync-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* 완료 시 화면 효과 */
        .finished .main-time { color: var(--accent-color); }
        .finished .milliseconds { display: none; }
    </style>
</head>
<body>

    <div class="timer-container">
        <div class="target-label">오픈_ 12:00 PM (UTC+9)</div>
        <div class="main-time" id="displayTime">--:--:--</div>
        <div class="milliseconds" id="displayMs">.000</div>
        <div class="access-label">Accessing to Talos 2</div>
    </div>

    <!-- <div class="status-bar">
        <div class="status-item">
            <div class="dot" id="syncDot"></div>
            <span id="syncText">연결 중...</span>
        </div>
        <div class="status-item">
            <span>Offset: <span id="offsetVal">0</span>ms</span>
        </div>
        <button class="sync-btn" onclick="syncWithServer()">SYNC NOW</button>
    </div> -->

<script>
    // 전역 상태
    let timeOffset = 0; // 서버 시간과 로컬 시간의 차이 (ms)
    let isSynced = false;
    let nextTargetTime = 0;
    
    const displayTimeEl = document.getElementById('displayTime');
    const displayMsEl = document.getElementById('displayMs');
    const syncDot = document.getElementById('syncDot');
    const syncText = document.getElementById('syncText');
    const offsetVal = document.getElementById('offsetVal');

    // KST(UTC+9) 기준 다음 12:00 계산
    function calculateNextNoonKST(nowServerTime) {
        // 현재 서버 시간(UTC 기준 timestamp)을 KST Date 객체로 변환 논리 적용
        const kstOffset = 9 * 60 * 60 * 1000;
        const nowKST = new Date(nowServerTime + kstOffset);
        
        // 오늘 12:00 KST 생성
        const targetKST = new Date(nowKST);
        targetKST.setUTCHours(12 - 9, 0, 0, 0); // KST 12시는 UTC 03시
        
        // 이미 12시가 지났다면 내일 12시로 설정
        if (nowKST.getTime() >= targetKST.getTime()) {
            targetKST.setDate(targetKST.getDate() + 1);
        }

        // UTC Timestamp 반환
        // targetKST는 이미 로컬 시간대 개념이 섞여있으므로, 명확하게 UTC timestamp로 변환
        // 위에서 setUTCHours를 썼으므로 targetKST 자체가 UTC 기준 03:00 (KST 12:00)임
        return targetKST.getTime(); 
    }

    const now = Date.now();
    nextTargetTime = calculateNextNoonKST(now);

    function updateTimer() {
        const now = Date.now() + timeOffset; // 보정된 현재 시간
        
        // 타겟 시간이 설정되지 않았으면 리턴
        if (!nextTargetTime) {
            requestAnimationFrame(updateTimer);
            return;
        }

        const distance = nextTargetTime - now;

        if (distance <= 0) {
            // 타이머 종료 시 처리
            displayTimeEl.innerText = "12:00:00";
            displayMsEl.innerText = ".000";
            document.body.classList.add('finished');
            
            // 1초 뒤에 다시 다음 날 12시로 리셋 로직이 필요하다면 여기에 추가
            // 여기서는 0이 된 상태 유지
        } else {
            document.body.classList.remove('finished');
            
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);
            const ms = Math.floor(distance % 1000);

            // 00 패딩
            const hh = h < 10 ? "0" + h : h;
            const mm = m < 10 ? "0" + m : m;
            const ss = s < 10 ? "0" + s : s;
            const mss = ms < 10 ? "00" + ms : ms < 100 ? "0" + ms : ms;

            displayTimeEl.innerText = `${hh}:${mm}:${ss}`;
            displayMsEl.innerText = `.${mss}`;
        }

        requestAnimationFrame(updateTimer);
    }

    // 초기 실행
    // syncWithServer();
    requestAnimationFrame(updateTimer);

    // 1분마다 재동기화하여 오차 누적 방지
    setInterval(syncWithServer, 60000);
    
    // 탭 활성화 시 즉시 재동기화
    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) syncWithServer();
    });

</script>
</body>
</html>
